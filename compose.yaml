services:
  db:
    image: docker.io/postgis/postgis:15-3.3
    container_name: fastapi_gis_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fastapi_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: 
      context: ./app
      dockerfile: Dockerfile
    container_name: fastapi_app
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app:z
    workdir: /app
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@{DB_HOST}:5432/${DB_NAME}
      - DB_HOST=${DB_HOST}
      - PYTHONPATH=/app/src:/app
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis}@redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: 
      context: ./app
      dockerfile: Dockerfile
    container_name: fastapi_celery_worker
    volumes:
      - ./app:/app:z
    workdir: /app
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:{DB_PORT}/${DB_NAME}
      - PYTHONPATH=/app/src:/app
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis}@redis:6379/1
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    command: celery -A src.core.celery_app worker --loglevel=info --concurrency=4
    restart: always

  celery_beat:
    build: 
      context: ./app
      dockerfile: Dockerfile
    container_name: fastapi_celery_beat
    volumes:
      - ./app:/app:z
      - celery_beat_schedule:/app/celery_beat_schedule
    workdir: /app
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - PYTHONPATH=/app/src:/app
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis}@redis:6379/1
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    command: celery -A src.core.celery_app beat --loglevel=info
    restart: always

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: react_web
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app:Z
      - /app/node_modules
      - /app/node_modules/.vite
    environment:
      - VITE_API_URL=/api
    depends_on:
      - app
    stdin_open: true
    tty: true

  nginx:
    image: nginx:alpine
    container_name: nginx_reverse_proxy
    restart: always
    ports:
      - "8888:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
      - ./nginx/conf.d:/etc/nginx/conf.d:ro,z
    depends_on:
      - app
      - web
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  redis_data:
  celery_beat_schedule: